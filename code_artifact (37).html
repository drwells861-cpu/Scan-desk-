<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الماسح الضوئي الذكي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- QRCode Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #reader video { border-radius: 0.5rem; object-fit: cover; }
        .toast { transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
        
        /* Custom Scrollbar for the table */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-qrcode text-2xl"></i>
            <h1 class="text-xl font-bold">الماسح الذكي برو</h1>
        </div>
        <div id="connectionStatus" class="flex items-center gap-2 text-sm font-semibold bg-indigo-700 px-3 py-1 rounded-full">
            <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="statusDot"></span>
            <span id="statusText">جاري الاتصال...</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="appContainer" class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center items-start">
        <!-- Views will be injected here via JavaScript -->
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none translate-y-4 toast flex items-center gap-2 z-50">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toastMsg">تمت العملية بنجاح</span>
    </div>

    <!-- Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        const state = {
            view: 'home', // home, receiver, scanner_pairing, scanner_active
            roomId: null,
            scannedData: [],
            html5QrCode: null,
            user: null,
            unsubscribe: null
        };

        // Firebase Setup
        let db, auth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-scanner-app';

        async function initFirebase() {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    // Fallback mock config for local testing without actual firebase environment
                    apiKey: "mock", authDomain: "mock", projectId: "mock" 
                };
                
                // If we are in the canvas environment, it will use the real config
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        state.user = user;
                        updateStatus('متصل', 'bg-green-400');
                        checkUrlForSession(); // Check if joined via link
                    }
                });
            } catch (error) {
                console.error("Firebase init error:", error);
                updateStatus('خطأ بالاتصال', 'bg-red-500');
            }
        }

        // --- Utility Functions ---

        function updateStatus(text, colorClass) {
            document.getElementById('statusText').innerText = text;
            const dot = document.getElementById('statusDot');
            dot.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.querySelector('#toastMsg').innerText = msg;
            toast.className = `fixed bottom-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg transition-all duration-300 flex items-center gap-2 z-50 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white opacity-100 translate-y-0`;
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function playBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gainNode = context.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(context.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 800; // Frequency in hertz
                gainNode.gain.setValueAtTime(0.1, context.currentTime);
                oscillator.start(context.currentTime);
                oscillator.stop(context.currentTime + 0.1);
            } catch(e) { console.log("Audio not supported"); }
        }

        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Copy to clipboard fallback for iFrame
        window.copyText = function(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("تم النسخ بنجاح");
            } catch (err) {
                showToast("فشل النسخ", "error");
            }
            document.body.removeChild(textArea);
        };

        // --- Routing & Rendering ---

        function checkUrlForSession() {
            const params = new URLSearchParams(window.location.search);
            const role = params.get('role');
            const room = params.get('room');

            if (role === 'scanner' && room) {
                state.roomId = room;
                renderView('scanner_active');
            } else {
                renderView('home');
            }
        }

        window.changeView = function(viewName) {
            if (state.html5QrCode) {
                state.html5QrCode.stop().catch(err => console.log("Stop error", err));
                state.html5QrCode = null;
            }
            if (state.unsubscribe) {
                state.unsubscribe();
                state.unsubscribe = null;
            }
            renderView(viewName);
        }

        function renderView(viewName) {
            state.view = viewName;
            const container = document.getElementById('appContainer');
            container.innerHTML = ''; // Clear current

            if (viewName === 'home') {
                container.innerHTML = `
                    <div class="glass-panel p-8 max-w-md w-full text-center space-y-6">
                        <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-4xl mb-4">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">مرحباً بك في النظام</h2>
                        <p class="text-gray-500 text-sm">حدد دور هذا الجهاز لبدء الاتصال</p>
                        
                        <div class="space-y-4 mt-8">
                            <button onclick="changeView('receiver')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-3">
                                <i class="fa-solid fa-desktop text-xl"></i>
                                جهاز استقبال (كمبيوتر)
                            </button>
                            
                            <div class="relative flex py-2 items-center">
                                <div class="flex-grow border-t border-gray-300"></div>
                                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">أو</span>
                                <div class="flex-grow border-t border-gray-300"></div>
                            </div>

                            <button onclick="changeView('scanner_pairing')" class="w-full bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-3">
                                <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                                هاتف ماسح (كاميرا)
                            </button>
                        </div>
                    </div>
                `;
            } 
            else if (viewName === 'receiver') {
                state.roomId = generateRoomId();
                const connectUrl = `${window.location.origin}${window.location.pathname}?role=scanner&room=${state.roomId}`;
                
                container.innerHTML = `
                    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Sidebar: Pairing Info -->
                        <div class="glass-panel p-6 flex flex-col items-center text-center space-y-4 lg:col-span-1">
                            <h3 class="font-bold text-lg text-gray-700">امسح الكود لربط الهاتف</h3>
                            <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm border border-gray-100"></div>
                            <p class="text-sm text-gray-500">أو افتح الرابط على هاتفك برقم الغرفة:</p>
                            <div class="bg-gray-100 px-4 py-2 rounded-lg font-mono text-xl font-bold tracking-widest text-indigo-700 w-full">
                                ${state.roomId}
                            </div>
                            <button onclick="changeView('home')" class="mt-auto text-gray-400 hover:text-red-500 text-sm underline pt-4">إنهاء الجلسة والعودة</button>
                        </div>

                        <!-- Main: Data Table -->
                        <div class="glass-panel p-6 lg:col-span-2 flex flex-col h-[70vh]">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-xl text-gray-800 flex items-center gap-2">
                                    <i class="fa-solid fa-list text-indigo-600"></i>
                                    البيانات الممسوحة
                                </h3>
                                <span id="scanCount" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">0 عنصر</span>
                            </div>
                            
                            <div class="flex-1 overflow-y-auto border border-gray-200 rounded-xl relative">
                                <table class="w-full text-right">
                                    <thead class="bg-gray-50 sticky top-0 shadow-sm">
                                        <tr>
                                            <th class="p-3 text-sm font-semibold text-gray-600">م</th>
                                            <th class="p-3 text-sm font-semibold text-gray-600">البيانات (الباركود)</th>
                                            <th class="p-3 text-sm font-semibold text-gray-600">الوقت</th>
                                            <th class="p-3 text-sm font-semibold text-gray-600 text-center">إجراء</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody" class="divide-y divide-gray-100">
                                        <tr><td colspan="4" class="p-8 text-center text-gray-400">في انتظار بدء المسح من الهاتف...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                // Generate QR Code
                setTimeout(() => {
                    new QRCode(document.getElementById("qrcode"), {
                        text: connectUrl,
                        width: 200,
                        height: 200,
                        colorDark : "#4f46e5",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }, 100);

                // Listen to Firestore Realtime
                startListeningToRoom(state.roomId);
            }
            else if (viewName === 'scanner_pairing') {
                container.innerHTML = `
                    <div class="glass-panel p-6 max-w-md w-full text-center space-y-6">
                        <h2 class="text-xl font-bold text-gray-800">ربط الكاميرا</h2>
                        <p class="text-gray-500 text-sm">قم بتوجيه الكاميرا نحو كود الـ QR المعروض على شاشة الكمبيوتر</p>
                        
                        <div class="rounded-xl overflow-hidden shadow-inner border-2 border-dashed border-indigo-300 relative bg-black aspect-square flex items-center justify-center">
                            <div id="reader" class="w-full h-full"></div>
                        </div>
                        
                        <div class="mt-4">
                            <p class="text-sm text-gray-400 mb-2">أو أدخل رقم الغرفة يدوياً</p>
                            <div class="flex gap-2">
                                <input type="text" id="manualRoomId" placeholder="مثال: A1B2C3" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-center font-mono uppercase">
                                <button onclick="joinManualRoom()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold">ربط</button>
                            </div>
                        </div>
                        
                        <button onclick="changeView('home')" class="text-gray-400 hover:text-gray-700 text-sm underline pt-2">العودة للرئيسية</button>
                    </div>
                `;

                setTimeout(() => {
                    initQrScannerForPairing();
                }, 200);
            }
            else if (viewName === 'scanner_active') {
                container.innerHTML = `
                    <div class="glass-panel p-4 max-w-md w-full h-full flex flex-col space-y-4 relative">
                        <div class="flex justify-between items-center bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                                <span class="text-sm font-bold text-indigo-900">متصل بالغرفة:</span>
                            </div>
                            <span class="font-mono font-bold tracking-wider text-indigo-700 bg-white px-2 py-1 rounded shadow-sm">${state.roomId}</span>
                        </div>
                        
                        <div class="flex-1 rounded-xl overflow-hidden shadow-inner border-2 border-indigo-600 bg-black relative flex flex-col">
                            <!-- Target Guideline -->
                            <div class="absolute inset-0 pointer-events-none z-10 flex items-center justify-center">
                                <div class="w-3/4 h-1/3 border-2 border-red-500/50 rounded-lg shadow-[0_0_0_4000px_rgba(0,0,0,0.5)]"></div>
                            </div>
                            <div id="reader" class="w-full h-full object-cover"></div>
                        </div>
                        
                        <div class="text-center p-2">
                            <p class="text-sm font-semibold text-gray-600 mb-2">وجّه الكاميرا نحو أي باركود ليتم إرساله فوراً</p>
                            <button onclick="changeView('home')" class="w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 rounded-xl transition duration-200">
                                <i class="fa-solid fa-power-off ml-2"></i> قطع الاتصال
                            </button>
                        </div>
                    </div>
                `;

                setTimeout(() => {
                    initBarcodeScanner();
                }, 200);
            }
        }

        // --- Scanner Logic ---
        
        window.joinManualRoom = function() {
            const input = document.getElementById('manualRoomId').value.trim().toUpperCase();
            if(input.length >= 4) {
                state.roomId = input;
                changeView('scanner_active');
            } else {
                showToast("الرجاء إدخال كود صحيح", "error");
            }
        }

        function initQrScannerForPairing() {
            state.html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            state.html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                // Check if it's a valid URL for our app
                try {
                    const url = new URL(decodedText);
                    const room = url.searchParams.get('room');
                    const role = url.searchParams.get('role');
                    if(role === 'scanner' && room) {
                        state.html5QrCode.stop().then(() => {
                            state.roomId = room;
                            playBeep();
                            changeView('scanner_active');
                        });
                    }
                } catch(e) {
                    // Not a URL, ignore or check if it's just a raw room ID
                    if(decodedText.length === 6) {
                         state.html5QrCode.stop().then(() => {
                            state.roomId = decodedText;
                            playBeep();
                            changeView('scanner_active');
                        });
                    }
                }
            }, (error) => {
                // Scanning in progress
            }).catch(err => {
                console.error(err);
                document.getElementById('reader').innerHTML = `<div class="p-4 text-white text-sm">عذراً، لا يمكن الوصول للكاميرا. تأكد من منح الصلاحيات.</div>`;
            });
        }

        let lastScannedText = "";
        let lastScanTime = 0;

        function initBarcodeScanner() {
            state.html5QrCode = new Html5Qrcode("reader");
            // Allow all formats for general barcode/QR scanning
            const config = { fps: 10, qrbox: { width: 300, height: 150 } }; // Wider box for 1D barcodes

            state.html5QrCode.start({ facingMode: "environment" }, config, async (decodedText) => {
                const now = Date.now();
                // Prevent duplicate scans within 2 seconds
                if (decodedText === lastScannedText && (now - lastScanTime) < 2000) {
                    return; 
                }
                
                lastScannedText = decodedText;
                lastScanTime = now;
                
                // Vibrate device
                if (navigator.vibrate) navigator.vibrate(200);
                playBeep();
                
                // Send to Firebase
                if(state.user && state.roomId) {
                    try {
                        // Using rule-compliant path: artifacts/appId/public/data/room_XYZ
                        const collectionPath = `artifacts/${appId}/public/data/room_${state.roomId}`;
                        await addDoc(collection(db, collectionPath), {
                            text: decodedText,
                            timestamp: serverTimestamp(),
                            sender: state.user.uid
                        });
                        showToast("تم الإرسال: " + decodedText.substring(0, 10) + "...");
                        
                        // Visual feedback on camera view
                        const readerDiv = document.getElementById('reader');
                        readerDiv.style.border = "4px solid #22c55e"; // green
                        setTimeout(() => readerDiv.style.border = "none", 300);

                    } catch (error) {
                        console.error("Error adding document: ", error);
                        showToast("خطأ في الإرسال", "error");
                    }
                }

            }, (error) => {
                // ignore scan errors
            }).catch(err => {
                document.getElementById('reader').innerHTML = `<div class="p-4 text-white text-sm">عذراً، لا يمكن الوصول للكاميرا.</div>`;
            });
        }

        // --- Receiver Logic (Firestore Realtime) ---

        function startListeningToRoom(roomId) {
            if(!state.user) return; // Must be auth'd

            const collectionPath = `artifacts/${appId}/public/data/room_${roomId}`;
            const q = query(collection(db, collectionPath));

            // Setup real-time listener
            state.unsubscribe = onSnapshot(q, (snapshot) => {
                let scans = [];
                snapshot.forEach((doc) => {
                    scans.push({ id: doc.id, ...doc.data() });
                });

                // Sort in memory (Rule 2: No orderBy in query to avoid index requirements)
                scans.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const timeB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return timeB - timeA; // Descending (newest first)
                });

                updateTable(scans);
            }, (error) => {
                console.error("Listen failed: ", error);
            });
        }

        function updateTable(scans) {
            const tbody = document.getElementById('tableBody');
            const countSpan = document.getElementById('scanCount');
            
            if(!tbody || !countSpan) return;

            countSpan.innerText = `${scans.length} عنصر`;

            if (scans.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400"><i class="fa-solid fa-qrcode text-4xl mb-3 block opacity-50"></i>في انتظار المسح من الهاتف...</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            scans.forEach((scan, index) => {
                const date = scan.timestamp ? new Date(scan.timestamp.toDate()).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : 'الآن';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50 transition-colors border-b border-gray-50 last:border-0";
                
                // Apply a highlight animation if it's the newest item (first one)
                if(index === 0 && scans.length > state.scannedData.length) {
                    tr.classList.add('bg-green-50');
                    setTimeout(() => tr.classList.remove('bg-green-50'), 1500);
                    playBeep(); // Alert receiver on new data
                }

                tr.innerHTML = `
                    <td class="p-3 text-sm text-gray-500">${scans.length - index}</td>
                    <td class="p-3 font-mono text-indigo-900 font-bold text-lg break-all">${escapeHtml(scan.text)}</td>
                    <td class="p-3 text-sm text-gray-500" dir="ltr">${date}</td>
                    <td class="p-3 text-center">
                        <button onclick="copyText('${escapeHtml(scan.text)}')" class="bg-white border border-gray-200 text-gray-600 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 px-3 py-1.5 rounded shadow-sm transition-all text-sm flex items-center gap-2 mx-auto">
                            <i class="fa-regular fa-copy"></i>
                            نسخ
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            state.scannedData = scans;
        }

        function escapeHtml(unsafe) {
            return (unsafe||"").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Init the App
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            renderView('home');
        });

    </script>
</body>
</html>
